plugins:
  - rubocop-rspec
  - rubocop-performance

AllCops:
  NewCops: enable
  Exclude:
    - "coverage/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
  SuggestExtensions: false


Style/StringLiterals:
  EnforcedStyle: double_quotes # el proyecto usa comillas dobles

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# Los tests de flujo (POST → job → GET) necesitan más de 5 lieas.
RSpec/ExampleLength:
  Max: 11

Metrics/AbcSize:
  Exclude:
    - "config/routes.rb"

Metrics/MethodLength:
  Exclude:
    - "config/routes.rb"